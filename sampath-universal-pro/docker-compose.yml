services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sampath
      POSTGRES_PASSWORD: sampath_dev_only
      POSTGRES_DB: sampath_pro
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampath -d sampath_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sampath:sampath_dev_only@db:5432/sampath_pro
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      AUTO_EXECUTION_ENABLED: "false"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
